<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentMujo Skills Hub</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #9aa0ac;
      --accent: #5b8def;
      --green: #34c77b;
      --yellow: #e0b94a;
      --red: #e5534b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    header h1 { font-size: 22px; margin-bottom: 4px; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
    }
    .stat b { font-size: 18px; display: block; color: var(--accent); }

    .filters {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px;
    }
    .filters input[type="text"] {
      flex: 1; min-width: 200px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 8px 12px; font-size: 14px;
    }
    .filters select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px;
    }
    .sort-group { display: inline-flex; gap: 6px; align-items: center; }
    .sort-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 8px 12px; font-size: 12.5px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .skill-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card h3 { font-size: 15px; color: var(--accent); word-break: break-word; }
    .card .desc { color: var(--muted); font-size: 13px; line-height: 1.4; min-height: 38px; }
    .card .category {
      align-self: flex-start; background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 8px; font-size: 11px; color: var(--muted);
    }
    .card .meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .card .meta .pill {
      background: var(--bg); border-radius: 999px; padding: 2px 10px;
    }
    .card .actions { display: flex; gap: 8px; margin-top: auto; }
    .card .actions button {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .card .actions button:hover { border-color: var(--accent); color: var(--accent); }
    .card .actions button.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .card .actions button.primary:hover { filter: brightness(1.1); }
    .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag-row .tag {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 6px; font-size: 10.5px; color: var(--muted);
    }
    .focused { outline: 2px solid var(--accent); }
    .selected { outline: 2px solid var(--green); }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.66);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      width: min(860px, 100%); max-height: 86vh; display: flex; flex-direction: column;
    }
    .modal header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .modal header h2 { font-size: 17px; color: var(--accent); word-break: break-word; }
    .modal .close {
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    .modal .close:hover { color: var(--text); border-color: var(--muted); }
    .modal .body { padding: 16px 18px; overflow-y: auto; }
    .modal .body .facts { display: grid; grid-template-columns: repeat(auto-fill,minmax(180px,1fr)); gap: 8px; margin-bottom: 14px; }
    .modal .body .fact { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
    .modal .body .fact b { display: block; color: var(--text); font-size: 13px; }
    .modal .body pre {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; font-size: 12px; line-height: 1.55; overflow: auto;
      white-space: pre-wrap; word-break: break-word; color: var(--text); max-height: 46vh;
    }
    .modal .body .preview-label { font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
    .modal .body .actions { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 18px; font-size: 13px; z-index: 60; display: none;
      box-shadow: 0 4px 18px rgba(0,0,0,.4);
    }
    .toast.show { display: block; }
    .score-good { color: var(--green); font-weight: 600; }
    .score-mid { color: var(--yellow); font-weight: 600; }
    .score-low { color: var(--red); font-weight: 600; }
    .risk-low { color: var(--green); }
    .risk-medium { color: var(--yellow); }
    .risk-high { color: var(--red); }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; }
    .badge-active { background: #173a2a; color: var(--green); }
    .badge-stale { background: #3a3117; color: var(--yellow); }
    .badge-invalid, .badge-removed { background: #3a1717; color: var(--red); }
    .empty {
      color: var(--muted); text-align: center; padding: 40px;
      grid-column: 1 / -1;
    }
    .loading { color: var(--muted); text-align: center; padding: 40px; grid-column: 1 / -1; }
    #result-count { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>AgentMujo <span>Skills Hub</span></h1>
    <p>Central registry browsing 13,888+ OpenCode skills</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <input type="text" id="q" placeholder="Search skills... (e.g. docker security)" />
    <input type="text" id="tag" list="taglist" placeholder="Tag filter" style="min-width:150px;width:160px;" />
    <datalist id="taglist"></datalist>
    <select id="category"><option value="All">All categories</option></select>
    <select id="minScore">
      <option value="">Any score</option>
      <option value="90">90+ (recommended)</option>
      <option value="80">80+ (good)</option>
      <option value="75">75+</option>
    </select>
    <select id="minStars">
      <option value="">Any stars</option>
      <option value="1000">1k+ stars</option>
      <option value="500">500+</option>
      <option value="100">100+</option>
      <option value="10">10+</option>
    </select>
    <select id="maxRisk">
      <option value="All">Any risk</option>
      <option value="low">Low only</option>
      <option value="medium">Medium or lower</option>
    </select>
    <select id="verified">
      <option value="">Any verification</option>
      <option value="1">Verified only</option>
    </select>
    <select id="status">
      <option value="All">Any status</option>
      <option value="active">Active</option>
      <option value="stale">Stale</option>
      <option value="invalid">Invalid</option>
      <option value="removed">Removed</option>
    </select>
    <span class="sort-group" role="group" aria-label="Sort results">
      <button type="button" class="sort-btn" id="sort-score">Score</button>
      <button type="button" class="sort-btn" id="sort-risk">Risk</button>
      <button type="button" class="sort-btn" id="sort-name">Name</button>
      <button type="button" class="sort-btn" id="sort-recent">Recent</button>
    </span>
  </div>

  <div id="result-count"></div>
  <div class="skill-list" id="skills"></div>
  <div style="text-align:center;padding:20px 0 40px;">
    <button type="button" class="sort-btn" id="load-more" style="display:none;">Load more</button>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header>
        <h2 id="modal-title"></h2>
        <button type="button" class="close" id="modal-close">Close</button>
      </header>
      <div class="body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
